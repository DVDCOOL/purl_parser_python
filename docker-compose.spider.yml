version: '3.8'

services:
  # Service 3: Spider (data collector)
  spider:
    image: my-spider
    build: 
      context: .
      dockerfile: spider/Dockerfile
    env_file:
      - .env  # ← Load from .env file
    # OR explicitly override specific variables:
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
      - WEBAPP_PORT=${WEBAPP_PORT}
      - WEBAPP_HOST=${WEBAPP_HOST}
      - FROM_EMAIL=${FROM_EMAIL}
      - NUMBER_OF_LEVELS=${NUMBER_OF_LEVELS}
      - TIMEOUT=${TIMEOUT}
      - LOCK_TTL_SECONDS=${LOCK_TTL_SECONDS}
      - PYTHONUNBUFFERED=1  # Ensure real-time logging
    stop_grace_period: 30s
    restart: on-failure
    networks:
      - app-network


# Create a network for all services
networks:
  app-network:
    driver: bridge