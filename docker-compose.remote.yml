version: '3.8'

services:
  inputer:
    image: my-inputer
    volumes:
      - ./shared/inputPURLS.txt:/app/shared/inputPURLS.txt  #
    build:
      context: .
      dockerfile: inputer/Dockerfile
    env_file:
      - .env  # ← Load from .env file
    # OR explicitly override specific variables:
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      - PYTHONUNBUFFERED=1  # Ensure real-time logging
      - INPUT_FILE=/app/shared/inputPURLS.txt  # Input file path
    stop_grace_period: 30s
    restart: on-failure
    networks:
      - app-network
  # Service 3: Spider (data collector)
  spider:
    image: my-spider
    depends_on:
      - inputer
    build: 
      context: .
      dockerfile: spider/Dockerfile
    env_file:
      - .env  # ← Load from .env file
    # OR explicitly override specific variables:
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
      - FROM_EMAIL=${FROM_EMAIL}
      - NUMBER_OF_LEVELS=${NUMBER_OF_LEVELS}
      - TIMEOUT=${TIMEOUT}
      - LOCK_TTL_SECONDS=${LOCK_TTL_SECONDS}
      - PYTHONUNBUFFERED=1  # Ensure real-time logging
    stop_grace_period: 30s
    restart: on-failure
    networks:
      - app-network

  webapp:
    image: my-webapp
    build:
      context: .
      dockerfile: webapp/Dockerfile
    ports:
      - "${WEBAPP_PORT}:${WEBAPP_PORT}"
    env_file:
      - .env
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      - PYTHONUNBUFFERED=1
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${WEBAPP_PORT}/health"]
      interval: 10s
      timeout: 3s
      retries: 5

# Create a network for all services
networks:
  app-network:
    driver: bridge