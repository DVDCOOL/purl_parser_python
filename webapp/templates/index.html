<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Spider Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="/">Spider Dashboard</a></div>
    <nav class="nav">
      <a href="/packages">Packages</a>
      <a href="/licenses">Licenses</a>
      <a href="/addpurl">Add PURLs</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>Spider Progress</h2>
      <div id="progress" class="progress-area">Waiting for events...</div>
    </section>

    <section class="card">
      <h2>Logs</h2>
      <pre id="logs" class="logs">Waiting for events...</pre>
    </section>
  </main>

  <script>
    // SSE connection to your existing endpoint (unchanged)
    (function(){
      const progressDiv = document.getElementById('progress');
      const logsPre = document.getElementById('logs');
      logsPre.textContent = '';

      try {
        const es = new EventSource('/progress-stream');
        const levels = {};
        const lines = [];
        const maxLines = 1000;

        es.onmessage = function(ev) {
          try {
            const data = JSON.parse(ev.data);
            if (data.type === 'progress') {
              const lvl = data.level;
              // remove deeper levels
              Object.keys(levels).map(n=>+n).filter(n=>n>lvl).forEach(n=>delete levels[n]);
              levels[lvl] = data.data;
              renderProgress();
            } else if (data.type === 'log') {
              lines.push(`${data.data.timestamp} ${'  '.repeat(data.data.level)}${data.data.message}`);
              if (lines.length > maxLines) lines.shift();
              logsPre.textContent = lines.join("\n");
              logsPre.scrollTop = logsPre.scrollHeight;
            } else if (data.type === 'init') {
              // initial state (optional)
            }
          } catch (e) {
            // ignore parse issues
          }
        };

        function renderProgress() {
          let html = '';
          Object.entries(levels).sort((a,b)=>a[0]-b[0]).forEach(([lvl, info])=>{
            html += `<div class="progress-line">Level ${lvl}: ${info.progress} — ${info.package} (page ${info.page})</div>`;
          });
          progressDiv.innerHTML = html || 'No active progress';
        }
      } catch (e) {
        logsPre.textContent = 'EventSource not supported or connection failed.';
      }
    })();
  </script>
</body>
</html>
