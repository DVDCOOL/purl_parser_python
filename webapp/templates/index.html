<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Spider Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="/">Spider Dashboard</a></div>
    <nav class="nav">
      <a href="/packages">Packages</a>
      <a href="/licenses">Licenses</a>
      <a href="/addpurl">Add PURLs</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>Spider Progress</h2>
      <div id="progress" class="progress-area">Waiting for events...</div>
    </section>

    <section class="card">
      <h2>Logs</h2>
      <pre id="logs" class="logs">Waiting for events...</pre>
    </section>
  </main>

  <script>
    (function() {
        const progressDiv = document.getElementById('progress');
        const logsPre = document.getElementById('logs');
        logsPre.textContent = '';

        const es = new EventSource('/progress-stream');
        const logLines = [];
        const maxLogs = 500;

        es.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);

                if (data.type === 'queue_stats') {
                    renderQueueStats(data.data);
                } else if (data.type === 'log') {
                    logLines.push(`${data.data.timestamp} ${'  '.repeat(data.data.level)}${data.data.message}`);
                    if (logLines.length > maxLogs) logLines.shift();
                    logsPre.textContent = logLines.join('\n');
                    logsPre.scrollTop = logsPre.scrollHeight;
                }
            } catch (e) {
                console.error('Error parsing SSE data:', e);
            }
        };

        function renderQueueStats(stats) {
            let html = `<div class="queue-summary">
                <strong>Total in Queue:</strong> ${stats.total} packages
                ${stats.scanned < stats.total ? ` (showing first ${stats.scanned})` : ''}
            </div>`;

            if (Object.keys(stats.levels).length > 0) {
                html += '<div class="level-breakdown"><strong>Packages per Level:</strong></div>';
                
                // Sort levels numerically
                Object.entries(stats.levels)
                    .sort(([a], [b]) => Number(a) - Number(b))
                    .forEach(([level, count]) => {
                        const percentage = ((count / stats.total) * 100).toFixed(1);
                        html += `<div class="progress-line">
                            Level ${level}: ${count} packages (${percentage}%)
                        </div>`;
                    });
            } else {
                html += '<div>Queue is empty</div>';
            }

            progressDiv.innerHTML = html;
        }

        es.onerror = function() {
            progressDiv.innerHTML = '<div>Connection lost. Retrying...</div>';
        };
    })();
    </script>
</body>
</html>
