<!DOCTYPE html>
<html>
<head>
    <title>Spider Dashboard</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        /* Navbar */
        .navbar {
            background-color: #111;
            padding: 15px;
            display: flex;
            gap: 25px;
            border-bottom: 2px solid #333;
        }

        .navbar a {
            color: #aaa;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
        }

        .navbar a.active {
            color: #00aaff;
            font-weight: bold;
        }

        /* Sections */
        .section {
            padding: 20px;
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: #222;
        }

        th, td {
            border: 1px solid #444;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #333;
        }

        /* Monitor log area */
        #logs {
            max-height: 500px;
            overflow-y: auto;
            background-color: #0c0c0c;
            padding: 10px;
            border: 1px solid #333;
            white-space: pre-wrap;
            font-family: monospace;
        }

        /* Form */
        textarea {
            width: 100%;
            height: 150px;
            background-color: #222;
            color: #eee;
            border: 1px solid #444;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            background-color: #00aaff;
            border: none;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0088cc;
        }

    </style>
</head>
<body>

    <div class="navbar">
        <a class="tab-button active" data-target="monitor">Monitor</a>
        <a class="tab-button" data-target="packages">Packages</a>
        <a class="tab-button" data-target="licenses">Licenses</a>
        <a class="tab-button" data-target="addpurl">Add PURLs</a>
    </div>

    <!-- ================= MONITOR ================= -->
    <div id="monitor" class="section active">
        <h2>Spider Progress</h2>
        <div id="progress"></div>

        <h2>Logs</h2>
        <div id="logs"></div>
    </div>

    <!-- ================= PACKAGES ================= -->
    <div id="packages" class="section">
        <h2>All Packages</h2>
        <div style="margin-bottom: 10px;">
            Show 
            <select id="limit-selector" onchange="loadPackages(1)">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100" selected>100</option>
            </select>
            packages per page
        </div>

        <div id="packages-table">Loading...</div>

        <div id="packages-pagination" style="margin-top: 10px;">
            <button id="prev-page" onclick="prevPage()">Previous</button>
            <span id="page-display"></span>
            <button id="next-page" onclick="nextPage()">Next</button>
        </div>

    </div>

    <!-- ================= LICENSES ================= -->
    <div id="licenses" class="section">
        <h2>All Licenses</h2>
        <div id="licenses-table">Loading...</div>
    </div>

    <!-- ================= ADD PURLs ================= -->
    <div id="addpurl" class="section">
        <h2>Add More PURLs</h2>
        <p>Paste one PURL per line:</p>
        <textarea id="purl-input"></textarea><br>
        <button onclick="submitPURLs()">Submit</button>
        <p id="submit-result"></p>
    </div>


    <script>
        /* ============ Tabs ============ */
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

                btn.classList.add('active');
                document.getElementById(btn.dataset.target).classList.add('active');

                if (btn.dataset.target === 'packages') loadPackages();
                if (btn.dataset.target === 'licenses') loadLicenses();
            });
        });

        /* ============ Live Log Monitor ============ */
        const progressDiv = document.getElementById('progress');
        const logsDiv = document.getElementById('logs');
        const levels = {};
        const logLines = [];
        const maxLogs = 500;

        const eventSource = new EventSource('/progress-stream');

        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);

            if (data.type === 'progress') {
                const lvl = data.level;

                // Remove deeper levels
                Object.keys(levels)
                    .map(n => parseInt(n))
                    .filter(n => n > lvl)
                    .forEach(n => delete levels[n]);

                // Update level data
                levels[lvl] = data.data;

                renderProgress();
            } else if (data.type === 'log') {
                logLines.push(`${data.data.timestamp} ${'  '.repeat(data.data.level)}${data.data.message}`);
                if (logLines.length > maxLogs) logLines.shift();
                renderLogs();
            }
        };

        function renderProgress() {
            let html = "";
            Object.entries(levels)
                .sort(([a], [b]) => a - b)
                .forEach(([lvl, info]) => {
                    html += `<div>LEVEL ${lvl}: ${info.progress} (page ${info.page}) - ${info.package}</div>`;
                });
            progressDiv.innerHTML = html;
        }

        function renderLogs() {
            logsDiv.textContent = logLines.join("\n");
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        /* ============ Load Packages Table ============ */
        let currentPage = 1;
        let currentLimit = 50;

        function loadPackages(page = currentPage) {
            currentPage = page;
            currentLimit = parseInt(document.getElementById("limit-selector").value);

            fetch(`/api/packages?page=${currentPage}&limit=${currentLimit}`)
                .then(r => r.json())
                .then(data => {
                    renderPackages(data.packages);
                    updatePagination(data.page, data.has_next);
                });
        }

        function renderPackages(packages) {
            let html = "<table><tr><th>Ecosystem</th><th>Name</th><th>Version</th><th>License</th></tr>";

            for (let pkg of packages) {
                html += `
                    <tr>
                        <td>${pkg.ecosystem}</td>
                        <td>${pkg.name}</td>
                        <td>${pkg.version || ''}</td>
                        <td>${pkg.license || ''}</td>
                    </tr>
                `;
            }

            html += "</table>";
            document.getElementById("packages-table").innerHTML = html;
        }

        function updatePagination(page, hasNext) {
            document.getElementById("page-display").innerText = "Page " + page;
            document.getElementById("prev-page").disabled = (page === 1);
            document.getElementById("next-page").disabled = !hasNext;
        }

        function nextPage() {
            loadPackages(currentPage + 1);
        }

        function prevPage() {
            if (currentPage > 1) {
                loadPackages(currentPage - 1);
            }
        }


        /* ============ Load Licenses Table ============ */
        function loadLicenses() {
            fetch('/db/licenses')
                .then(r => r.json())
                .then(data => {
                    let html = "<table><tr><th>License</th><th>Count</th></tr>";
                    for (let [lic, num] of Object.entries(data.licenses)) {
                        html += `<tr><td>${lic}</td><td>${num}</td></tr>`;
                    }
                    html += "</table>";
                    document.getElementById("licenses-table").innerHTML = html;
                });
        }

        /* ============ Submit new PURLs ============ */
        function submitPURLs() {
            const text = document.getElementById("purl-input").value;

            fetch('/add_purls', {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({purls: text})
            })
            .then(r => r.json())
            .then(resp => {
                document.getElementById("submit-result").innerText = resp.status;
            });
        }
    </script>

</body>
</html>
